    <style>
        body {
            background-color: #050505;
            display: flex;

            margin: 0;

        /* Hide Scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Glass Navigation */
        .glass-nav {
            background: rgba(20, 20, 20, 0.92);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-top: 0.5px solid rgba(255, 255, 255, 0.1);
        }

        /* Dynamic Island */
        .dynamic-island {
            position: absolute;
            top: 11px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 35px;
            background: black;
            border-radius: 20px;
            z-index: 100;
            pointer-events: none;
        }

        /* Rhombus Button */
        .rhombus-btn {
            width: 54px;
            height: 54px;
            background-color: #CCFF00;
            border-radius: 16px;
            transform: rotate(45deg);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(204, 255, 0, 0.3);
            border: 3px solid #000;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
        }
        .rhombus-btn:active {
            transform: rotate(45deg) scale(0.9);
        }
        .rhombus-icon {
            transform: rotate(-45deg);
            color: #000;
            font-size: 32px;
        }

        /* Masonry Grid */
        .masonry-grid {
            column-count: 2;
            column-gap: 12px;
        }
        .masonry-item {
            break-inside: avoid;
            page-break-inside: avoid;
            margin-bottom: 12px;
            transform: translateZ(0);
        }

        /* Content Padding for Bottom Nav */
        .scroll-content {
            padding-bottom: 120px;
        }

        .bg-grid-pattern {
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* Download Source Button (Utility) */
        .download-source-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #CCFF00;
            color: black;
            padding: 12px 24px;
            border-radius: 999px;
            font-weight: 700;
            font-family: 'Space Mono', monospace;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(204, 255, 0, 0.3);
            transition: all 0.2s ease;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 2px solid white;
        }
        .download-source-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(204, 255, 0, 0.5);
        }
        .download-source-btn:active {
            transform: scale(0.95);
        }
        
        @media (max-width: 640px) {
            .download-source-btn {
                display: none; /* Hide on actual mobile devices if viewed directly, kept for desktop preview */
            }
        }

    <script>
        // --- Data & State ---
        const state = {
            currentHomeTab: 'recommend', 
            user: { name: '设计师_X', id: 'NICE-888' },
            recommendPosts: [
                { id: 1, title: '复古球衣穿搭', subtitle: 'RETRO FIT', type: 'img', likes: 328, 
                  img: 'assets/1765264647584.jpg' },

                  img: 'assets/1765264645664.jpg' },
                { id: 4, title: '战术板 UI', subtitle: 'TACTICAL', type: 'img', likes: 500, 
                  img: 'assets/1765264656469.jpg' }
            ],
            inspirationPosts: [
                { id: 101, title: '手绘草稿 #01', subtitle: 'SKETCH', likes: 55, img: 'assets/1765264651401.jpg' },
                { id: 102, title: '矢量版型库', subtitle: 'VECTOR', likes: 200, img: 'assets/1765264641079.jpg' },
                { id: 103, title: '网眼纹理', subtitle: 'TEXTURE', likes: 89, img: 'assets/1765264653321.jpg' },
                { id: 104, title: '大师设计手稿', subtitle: 'ARCHIVE', likes: 999, img: 'assets/1765264654621.jpg' },
            ],
            templates: [
                { id: 't1', name: '经典 V 领', tags: ['复古', '篮球'], img: 'assets/1765264660095.jpg' },
                { id: 't2', name: '圆领紧身', tags: ['现代', '训练'], img: 'assets/1765264658736.jpg' },
                { id: 't3', name: '连帽投篮服', tags: ['热身', '休闲'], img: 'assets/1765264661634.jpg' },
            ]
        };

        // --- Router Engine ---
        const router = {
            navigate: (viewName, params = {}) => {
                const appView = document.getElementById('app-view');
                const bottomNav = document.getElementById('bottom-nav');
                
                if (viewName === 'home') {
                    if(params.tab) state.currentHomeTab = params.tab;
                    else if(!state.currentHomeTab) state.currentHomeTab = 'recommend';
                }

                const hideNavViews = ['login', 'creationMenu', 'aiDesign', 'templateList', 'templateDetail', 'detail'];
                
                // Nav visibility logic
                if (hideNavViews.includes(viewName)) {
                    bottomNav.style.transform = 'translateY(100%)';
                } else {
                    bottomNav.style.transform = 'translateY(0)';
                    updateActiveNav(viewName);
                }

                appView.style.opacity = '0';
                router.pending = setTimeout(() => {
                    appView.innerHTML = views[viewName](params);
                    nbAfterRender(viewName, params);
                    appView.scrollTop = 0;
                    appView.style.opacity = '1';
                    
                    if(appView.firstElementChild) {
                        appView.firstElementChild.classList.add('animate-fade-in');
                    }
                }, 150);
            }
        };

        const updateActiveNav = (viewName) => {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                const target = btn.dataset.target;
                const icon = btn.querySelector('.material-symbols-outlined');
                
                if (target === viewName) {
                    btn.classList.remove('text-gray-500');
                    btn.classList.add('text-acid-lime');
                    icon.classList.add('fill-current'); 
                } else {
                    btn.classList.add('text-gray-500');
                    btn.classList.remove('text-acid-lime');
                    icon.classList.remove('fill-current');
                }
            });
        };

        const showToast = (msg, type='success') => {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = `px-6 py-3 bg-[#1C1C1E]/95 backdrop-blur-xl border border-white/10 rounded-full shadow-2xl flex items-center gap-3 animate-slide-up`;
            t.innerHTML = `
                <span class="material-symbols-outlined text-[20px] ${type === 'success' ? 'text-acid-lime' : 'text-red-500'}">${type === 'success' ? 'check_circle' : 'error'}</span>
                <span class="text-[13px] font-bold text-white tracking-wide">${msg}</span>
            `;
            c.appendChild(t);
            setTimeout(() => {
                t.style.opacity = '0';
                t.style.transform = 'translateY(-20px)';
                setTimeout(() => t.remove(), 300);
            }, 2000);
        };

        // --- File Download Logic ---
        function downloadSourceFile() {
            // Get the entire HTML content of the current document
            // We need to remove the download button itself from the exported code to make it clean
            const btn = document.querySelector('.download-source-btn');
            const originalDisplay = btn.style.display;
            btn.style.display = 'none';
            
            const htmlContent = document.documentElement.outerHTML;
            
            // Restore button
            btn.style.display = originalDisplay;

            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'nice-ball-app.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // --- Views ---
        const views = {
            login: () => `
                <div class="h-full flex flex-col justify-center px-8 relative overflow-hidden bg-acid-black">
                    <div class="absolute -top-32 -left-32 w-80 h-80 bg-acid-purple rounded-full mix-blend-screen filter blur-[100px] opacity-20 animate-pulse"></div>

                        </div>
                        <h1 class="text-[40px] font-black italic tracking-tighter text-white mb-2 leading-none">NICE BALL<span class="text-acid-lime">.</span></h1>
                        <p class="text-[10px] font-mono text-gray-400 tracking-[0.4em] uppercase">数字更衣室 V2.1</p>
                    </div>
                    <div class="space-y-4 z-10 w-full">
                        <div class="bg-white/5 border border-white/10 rounded-2xl px-4 py-3.5 flex items-center gap-4 focus-within:border-acid-lime transition-colors">
                            <span class="font-mono font-bold text-acid-lime text-sm">+86</span>
                            <input type="tel" id="login-phone" placeholder="请输入手机号" class="bg-transparent border-none outline-none text-white w-full placeholder-gray-600 font-mono text-sm h-6">
                        </div>
                        <div class="bg-white/5 border border-white/10 rounded-2xl px-4 py-3.5 flex items-center justify-between focus-within:border-acid-lime transition-colors">
                            <input type="text" id="login-code" placeholder="验证码" class="bg-transparent border-none outline-none text-white w-full placeholder-gray-600 font-mono text-sm h-6">
                            <button class="text-[11px] font-bold text-acid-lime opacity-80 hover:opacity-100">获取</button>
                        </div>
                        <button onclick="router.navigate('home')" class="w-full bg-acid-lime text-black font-black italic py-4 mt-6 rounded-2xl shadow-[0_4px_0_#9cb300] active:translate-y-1 active:shadow-none transition-all uppercase tracking-widest text-[16px] flex justify-center items-center gap-2 group">
                            <span>立即进入</span>
                            <span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
                        </button>
                    </div>
                </div>
            `,

            home: () => `
                <div class="h-full flex flex-col">
                    <div class="px-5 pt-2 pb-3 sticky top-0 z-30 bg-acid-black/95 backdrop-blur-md border-b border-white/5">
                         <div class="flex items-center justify-between mb-4">
                             <div class="flex items-center gap-2">
                                <span class="font-black italic text-[22px] text-white tracking-tight">NICE</span>
                                <span class="text-[9px] font-mono text-acid-lime border border-acid-lime px-1.5 rounded-sm">BETA</span>
                            </div>
                            <div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center border border-white/10">
                                <span class="material-symbols-outlined text-white text-[18px]">person</span>
                            </div>
                        </div>
                        <div class="relative w-full">
                            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-[18px]">search</span>
                            <input type="text" placeholder="搜索球衣、灵感..." class="w-full bg-[#1C1C1E] border border-white/10 rounded-xl py-2 pl-9 pr-4 text-white text-xs outline-none focus:border-acid-lime/50 transition-colors placeholder-gray-600">
                        </div>
                    </div>

                    <div class="flex-1 overflow-y-auto mt-2 scroll-content relative no-scrollbar pb-32">

                             <button class="whitespace-nowrap px-4 py-1.5 bg-[#1C1C1E] text-white text-[12px] font-bold rounded-full border border-white/10">穿搭</button>

        // --- Logic ---
        function handleAIGenerate() {
            const input = document.getElementById('prompt-input');
            const loader = document.getElementById('ai-loader');
            const img = document.getElementById('generated-image');
            const placeholder = document.getElementById('ai-placeholder');
            
            if (!input.value) return;

            loader.classList.remove('hidden');
            loader.classList.add('flex');
            
            setTimeout(() => {
                const prompt = encodeURIComponent(input.value + " basketball jersey design vector style");
                img.src = `/gen?prompt=${prompt}&aspect=1:1`;
                img.onload = () => {
                    loader.classList.add('hidden');
                    loader.classList.remove('flex');
                    img.classList.remove('hidden');
                    placeholder.classList.add('hidden');
                    showToast('方案生成完毕');
                }
            }, 1500);
        }

        function setJerseyColor(color) {
            const layer = document.getElementById('jersey-color-layer');
            if (layer) layer.style.backgroundColor = color;
        }

        function changeColor(color) {
            const img = document.getElementById('product-image');
            img.style.filter = 'none';
            if (color === 'white') img.style.filter = 'grayscale(100%) brightness(120%)';
            else if (color === 'purple') img.style.filter = 'hue-rotate(240deg) saturate(150%)';
        }

        function downloadSourceFile() {
            const btn = document.querySelector('.download-source-btn');
            if(btn) btn.style.display = 'none'; // Hide button in source
            const htmlContent = document.documentElement.outerHTML;
            if(btn) btn.style.display = 'flex'; // Show again

            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'nice-ball-prototype.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            const hashRoute=(location.hash.slice(2)||'').split('?')[0];
            const map={home:'home',team:'collab',create:'creationMenu',templates:'templateList',editor:'templateDetail',assistant:'aiDesign',messages:'messages',chat:'messages',profile:'profile',orders:'profile',cart:'profile',settings:'profile',detail:'detail'};
            const q=new URLSearchParams((location.hash.split('?')[1]||''));
            const screen=map[hashRoute];
            router.navigate(screen||'login',screen==='templateDetail'&&q.get('id')?{work:q.get('id')}:{});
        });
